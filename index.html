<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121412">
<title>Круговорот для телефона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Макет: полноэкранная улица на холсте; слева сверху — касса, сверху — шкала человечества,
   справа — конторская книга управления (на телефоне — нижняя шторка). Чистая 1-битная графика. */
:root {
  --paper: #e6e8e3;
  --ink: #121412;
  --ink-2: #565b54;
  --rule: #b6bab1;
  --panel: #f2f3ef;
  --ghost: rgba(18, 20, 18, .07);
  --f-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --hard: 4px 4px 0 var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111210; --ink: #e3e5df; --ink-2: #9a9f96; --rule: #3a3d37; --panel: #181917; --ghost: rgba(227, 229, 223, .07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111210; --ink: #e3e5df; --ink-2: #9a9f96; --rule: #3a3d37; --panel: #181917; --ghost: rgba(227, 229, 223, .07);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.grabbing { cursor: grabbing; }
#cv.pointing { cursor: pointer; }

/* ---------- касса ---------- */
.hud {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px; pointer-events: none; max-width: calc(100% - 32px);
  background: color-mix(in srgb, var(--paper) 86%, transparent); padding: 2px 12px 6px 0;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--f-display); font-weight: 900; font-size: 20px; letter-spacing: .02em; }
.brand span { font-size: 11px; color: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; }
.cash { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cash #money { font-family: var(--f-mono); font-weight: 600; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.cash #rate { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meters { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.meters b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; }
.buff {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); padding: 3px 7px; position: relative; overflow: hidden;
}
.buff i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--paper); opacity: .7; }

/* ---------- шкала человечества ---------- */
.humanity {
  position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(520px, calc(100% - 820px)); min-width: 280px; pointer-events: none; display: grid; gap: 5px;
  background: color-mix(in srgb, var(--paper) 86%, transparent); padding: 2px 0 4px;
}
.humanity .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.humanity .row b { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 500; }
.ticks { display: grid; grid-template-columns: repeat(82, 1fr); gap: 1px; height: 10px; }
.ticks i { background: var(--ghost); border-bottom: 1px solid var(--rule); }
.ticks i.on { background: var(--ink); border-color: var(--ink); }
.ticks i.part { background: linear-gradient(90deg, var(--ink) var(--p), var(--ghost) var(--p)); }

/* ---------- панель ---------- */
.panel {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  right: max(14px, env(safe-area-inset-right, 0px)); width: 372px;
  background: var(--panel); border: 1.5px solid var(--ink); box-shadow: var(--hard);
  display: flex; flex-direction: column; min-height: 0;
}
.tabs { display: grid; grid-template-columns: 0.9fr 0.9fr 0.9fr 1fr 1.25fr 0.8fr; border-bottom: 1.5px solid var(--ink); }
.tabs button {
  border: 0; background: transparent; padding: 11px 2px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
  text-transform: uppercase; border-right: 1px solid var(--rule); position: relative;
}
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.tabs button .dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
.subbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 11px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { border: 0; background: transparent; padding: 3px 9px; font-family: var(--f-mono); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.body { overflow-y: auto; padding: 12px 14px 18px; display: grid; gap: 10px; align-content: start; min-height: 0; flex: 1; overscroll-behavior: contain; }
.body::-webkit-scrollbar { width: 8px; } .body::-webkit-scrollbar-thumb { background: var(--rule); }

.sect { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); padding-top: 6px; display: flex; align-items: center; gap: 8px; }
.sect::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
.readout { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); }
.readout div { padding: 8px 10px; display: grid; gap: 2px; border-bottom: 1px solid var(--rule); }
.readout div:nth-child(odd) { border-right: 1px solid var(--rule); }
.readout div:nth-last-child(-n+2) { border-bottom: 0; }
.readout span { font-size: 10.5px; color: var(--ink-2); letter-spacing: .05em; text-transform: uppercase; }
.readout b { font-family: var(--f-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }

.up { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0 10px; border-bottom: 1px solid var(--rule); }
.up:last-child { border-bottom: 0; }
.up-title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.up-title .lvl { font-family: var(--f-mono); font-weight: 400; font-size: 11.5px; color: var(--ink-2); }
.up-eff { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; min-width: 0; }
.up-eff b { color: var(--ink); font-weight: 600; font-family: var(--f-mono); font-size: 12px; }
.buy {
  grid-row: 1 / span 2; grid-column: 2; min-width: 104px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--panel);
  padding: 7px 10px; display: grid; justify-items: end; gap: 1px; text-align: right;
}
.buy .c { font-family: var(--f-mono); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy .n { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.buy:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
.buy:not(:disabled):active { transform: translate(1px, 1px); box-shadow: none; }
.buy:disabled { background: transparent; color: var(--ink-2); border-style: dashed; border-color: var(--ink-2); cursor: default; }
.buy.wide { grid-column: 1 / -1; grid-row: auto; justify-items: center; min-width: 0; padding: 10px; }
.up.locked { opacity: .55; }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.note b { color: var(--ink); }

.ctl { display: grid; gap: 8px; border: 1px solid var(--rule); padding: 10px; }
.ctl label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.ctl input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); }
.ctl input[type="range"] { width: 100%; accent-color: var(--ink); }
.ctl .rangerow { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }

.stage-now { border: 1.5px solid var(--ink); padding: 12px; display: grid; gap: 6px; }
.stage-now small { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.stage-now h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.15; text-wrap: balance; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; }
.ladder li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; align-items: baseline; }
.ladder li span:first-child { font-family: var(--f-mono); color: var(--ink-2); font-size: 11.5px; }
.ladder li span:last-child { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.ladder li.done { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--rule); }
.ladder li.cur { font-weight: 700; }
.ladder li.cur span:first-child::before { content: "▶ "; color: var(--ink); }

.bigbtn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--panel); padding: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
.bigbtn:disabled { background: transparent; color: var(--ink-2); border-style: dashed; cursor: default; }
.bigbtn.ghost { background: transparent; color: var(--ink); }
.bigbtn.armed { background: repeating-linear-gradient(-45deg, var(--ink) 0 8px, var(--ink-2) 8px 16px); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--ink-2); }
.kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--paper); border: 1px solid var(--ink); padding: 8px; font-family: var(--f-mono); font-size: 11px; user-select: text; -webkit-user-select: text; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > * { flex: 1; }
.keys { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--ink-2); border-bottom-width: 2px; padding: 0 5px; color: var(--ink); }

/* ---------- подсказка и тосты ---------- */
.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  max-width: min(460px, calc(100% - 430px)); font-size: 13px; line-height: 1.4; display: flex; gap: 10px; align-items: flex-start; pointer-events: none;
}
.hint::before { content: "→"; font-family: var(--f-mono); font-weight: 600; }
#toasts { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(520px, calc(100% - 32px)); z-index: 5; }
.toast { background: var(--ink); color: var(--paper); padding: 8px 14px; font-size: 13px; font-weight: 500; box-shadow: 3px 3px 0 var(--rule); animation: tin .25s ease-out; text-align: center; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }

/* ---------- окна ---------- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 70%, transparent); z-index: 10; padding: 16px; }
.card { background: var(--panel); border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); width: min(500px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 22px 22px 20px; display: grid; gap: 14px; }
.card h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.card p { margin: 0; line-height: 1.5; font-size: 14px; max-width: 62ch; }
.card .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- баланс, списки, журнал ---------- */
.author-badge { display: inline-block; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--paper); padding: 3px 7px; background: repeating-linear-gradient(-45deg, var(--ink) 0 6px, var(--ink-2) 6px 12px); align-self: center; }
.balance { border: 1px solid var(--rule); padding: 10px; display: grid; gap: 7px; }
.balance .bar { display: grid; grid-template-columns: 112px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.balance .bar > span:first-child { color: var(--ink-2); }
.balance .track { height: 8px; background: var(--ghost); position: relative; border: 1px solid var(--rule); }
.balance .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.balance .fill.light { background: var(--ink-2); }
.balance .bar b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
.balance .verdict { font-size: 12.5px; line-height: 1.45; border-top: 1px dashed var(--rule); padding-top: 7px; }
.list { display: grid; gap: 4px; align-content: start; }
.list h3 { margin: 0; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.list ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; align-content: start; }
.list li { font-size: 13.5px; line-height: 1.4; padding-left: 18px; position: relative; }
.list li::before { content: attr(data-m); position: absolute; left: 0; top: 0; font-family: var(--f-mono); font-weight: 600; }
.list li b { font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; border: 1px dashed var(--ink-2); padding: 10px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); flex: none; margin: 1px 0 0; }
.warn { border-left: 3px solid var(--ink); padding: 7px 10px; font-size: 13px; line-height: 1.45; background: var(--ghost); }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; border: 1px solid var(--rule); }
.log li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--rule); line-height: 1.35; }
.log li:last-child { border-bottom: 0; }
.log li span:first-child { font-family: var(--f-mono); color: var(--ink-2); font-size: 11.5px; }
.buy.lockbtn .c { white-space: normal; font-size: 11px; font-weight: 500; line-height: 1.25; max-width: 110px; }
.authorbox { border: 1.5px dashed var(--ink); padding: 10px; display: grid; gap: 8px; }
.authorbox .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.authorbox .grid2 button { padding: 8px 6px; font-size: 11.5px; }
.card.wide { width: min(600px, 100%); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.cols .list:first-child { grid-column: 1 / -1; }
@media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }

/* ---------- касса и привод ---------- */
.fin { border: 1.5px solid var(--ink); display: grid; }
.fin-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.fin-row b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.fin-row.total { border-bottom: 0; background: var(--ink); color: var(--panel); font-weight: 700; }
.fin-row.total b { font-weight: 600; }
.fin-row.total.neg { background: repeating-linear-gradient(-45deg, var(--ink) 0 8px, var(--ink-2) 8px 16px); }
.spark { width: 100%; height: 64px; display: block; border: 1px solid var(--rule); background: var(--paper); }
.drive { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.ctl .bar.fw { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.ctl .bar.fw > span { color: var(--ink-2); }
.ctl .bar.fw .track { height: 8px; background: var(--ghost); position: relative; border: 1px solid var(--rule); }
.ctl .bar.fw .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.ctl .bar.fw b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; }
.check.slim { padding: 8px 10px; font-size: 12.5px; border-style: dotted; }
.contracts { display: grid; gap: 6px; }

/* ---------- поломка и ремонт ---------- */
.repair { border: 1.5px solid var(--ink); padding: 10px; display: grid; gap: 8px; }
.repair .rstate { font-weight: 700; font-size: 13.5px; }
.repair .track { height: 10px; background: var(--ghost); border: 1px solid var(--rule); position: relative; }
.repair .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width .3s; }
.repair.risk { border-style: dashed; }
.repair.bad { background: repeating-linear-gradient(-45deg, var(--ghost) 0 10px, transparent 10px 20px); border-width: 3px; }
.repair.bad .rstate { font-family: var(--f-display); letter-spacing: .06em; }
.alert {
  position: absolute; left: 50%; transform: translateX(-50%); top: 62px; z-index: 6;
  width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--paper);
  display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 10px 12px; box-shadow: 4px 4px 0 var(--rule);
}
.alert.warn { background: var(--panel); color: var(--ink); border: 1.5px dashed var(--ink); }
.alert span { font-size: 13px; font-weight: 600; line-height: 1.35; }
.alert button { border: 1.5px solid var(--paper); background: var(--paper); color: var(--ink); padding: 8px 12px; font-weight: 700; font-size: 12px; letter-spacing: .03em; }
.alert.warn button { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.alert button:disabled { opacity: .55; cursor: default; }
.alert i { grid-column: 1 / -1; height: 4px; background: var(--paper); opacity: .85; width: 0; }
.alert.warn i { background: var(--ink); }

/* ---------- телефон (класс .m ставит скрипт: узкий экран или мобильная версия) ---------- */
#pushbtn, #sheet-grip { display: none; }
body.m .panel { left: 0; right: 0; bottom: 0; top: auto; height: 46%; width: auto; border-width: 1.5px 0 0; box-shadow: none; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .25s ease; }
body.m.sheet-collapsed .panel { height: calc(118px + env(safe-area-inset-bottom, 0px)); }
body.m.sheet-full .panel { height: 84%; }
body.m.sheet-collapsed .panel .body { visibility: hidden; }
body.m #sheet-grip { display: flex; justify-content: center; align-items: center; height: 26px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; width: 100%; touch-action: none; gap: 8px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
body.m #sheet-grip::before { content: ""; width: 44px; height: 4px; background: var(--ink-2); border-radius: 2px; }
body.m .tabs button { font-size: 9.5px; letter-spacing: 0; padding: 12px 0 11px; touch-action: manipulation; }
body.m .humanity { top: auto; bottom: calc(var(--sheet-gap, 46%) + 8px); left: max(16px, env(safe-area-inset-left, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 92px); transform: none; width: auto; min-width: 0; }
body.m .hint { display: none; }
body.m .cash #money { font-size: 24px; }
body.m .brand span { display: none; }
body.m #toasts { top: 120px; }
body.m .alert { top: auto; bottom: calc(var(--sheet-gap, 46%) + 8px); left: max(12px, env(safe-area-inset-left, 0px)); right: calc(max(14px, env(safe-area-inset-right, 0px)) + 90px); width: auto; transform: none; grid-template-columns: 1fr; padding: 9px 10px; gap: 7px; }
body.m .alert span { font-size: 12px; }
body.m .alert button { padding: 10px; font-size: 12.5px; }
body.m .buy { min-height: 48px; min-width: 112px; }
body.m .seg button { padding: 7px 11px; }
body.m button, body.m input { touch-action: manipulation; }
body.m #pushbtn {

<script>
/* ================================================================
   КРУГОВОРОТ — игровая логика v3 (без DOM, тестируется в Node)
   Экономика: выручка = вошедшие × плата за вход × комбо;
   расходы = аренда здания + электричество автопривода + ремонт.
   ================================================================ */
const Logic = (() => {
  const TAU = Math.PI * 2;
  const GOAL = 8.2e9;            // всё человечество
  const MAX_OMEGA = 30;          // рад/с — предел конструкции
  const HAND_MAX = 20;           // рад/с — быстрее рука курсором не крутит
  const LEAVE_RATE = 0.035;      // доля очереди, уходящая в секунду
  const SE_DIV = 1e5;            // делитель для энергии вращения

  // ---------- опорная кривая дохода ----------
  // IREF[s] — доход в ₽/с «у потолка» здания s (посчитан test/tune.js); x = −1 — самое начало игры.
  // Все цены выражены через неё: «столько-то секунд дохода в таком-то здании».
  const IREF = [64, 3.81e3, 1.27e5, 2.26e6, 7.56e7, 1.24e9, 3.15e10, 4.18e11, 5.77e12];
  const ISTART = 3;
  function Iref(x) {
    if (x <= -1) return ISTART * Math.pow(IREF[0] / ISTART, x + 1);
    if (x < 0) return Math.exp(Math.log(ISTART) + (Math.log(IREF[0]) - Math.log(ISTART)) * (x + 1));
    if (x >= 8) return IREF[8] * Math.pow(IREF[8] / IREF[7], x - 8);
    const i = Math.floor(x), f = x - i;
    return Math.exp(Math.log(IREF[i]) * (1 - f) + Math.log(IREF[i + 1]) * f);
  }
  const STAGE_SECONDS = [30, 60, 100, 140, 180, 220, 260, 300];

  // ---------- здания ----------
  // loc — пешеходов в секунду у этого места; fee — базовая плата за вход, ₽; rent — аренда, ₽/с
  const STAGES = [
    { name: 'Ларёк у дома',      sign: 'ЛАРЁК',         cost: 0,      loc: 0.7,  fee: 10,    rent: 0 },
    { name: 'Магазин у дома',    sign: 'ПРОДУКТЫ',      cost: 0,  loc: 2.0,  fee: 25,    rent: 0 },
    { name: 'Супермаркет',       sign: 'СУПЕРМАРКЕТ',   cost: 0,  loc: 6,    fee: 60,    rent: 0 },
    { name: 'Универмаг',         sign: 'УНИВЕРМАГ',     cost: 0,    loc: 18,   fee: 150,   rent: 0 },
    { name: 'Торговый центр',    sign: 'ТЦ «ОРБИТА»',   cost: 0,    loc: 55,   fee: 400,   rent: 0 },
    { name: 'Небоскрёб-штаб',    sign: 'КРУГОВОРОТ',    cost: 0,   loc: 160,  fee: 1000,  rent: 0 },
    { name: 'Вокзал-гигант',     sign: 'ЦЕНТРАЛЬНЫЙ',   cost: 0,   loc: 480,  fee: 2500,  rent: 0 },
    { name: 'Городской узел',    sign: 'ГОРОД',         cost: 0,   loc: 1400, fee: 6000,  rent: 0 },
    { name: 'Планетарный вход',  sign: 'ВХОД ДЛЯ ВСЕХ', cost: 0,   loc: 4200, fee: 15000, rent: 0 },
  ];

  STAGES.forEach((S, i) => { S.cost = i ? Number((IREF[i - 1] * STAGE_SECONDS[i - 1]).toPrecision(2)) : 0; S.rent = i ? Number((IREF[i] * 0.02).toPrecision(2)) : 0; });

  // ---------- лопасти ----------
  // ws — оптимальные обороты (рад/с): быстрее люди не успевают войти; k — плотность загрузки отсека
  const SHAPES = [
    { name: 'Прямые',     ws: 1.6, k: 1.00, cost: 0,      stage: 0, d: 'Обычные стеклянные створки.' },
    { name: 'Ковш',       ws: 2.6, k: 1.15, cost: 0,    stage: 0, d: 'Изогнутые створки зачерпывают людей.' },
    { name: 'Крыльчатка', ws: 4.2, k: 1.30, cost: 0,    stage: 2, d: 'Как в насосе: втягивает толпу.' },
    { name: 'Спираль',    ws: 6.8, k: 1.50, cost: 0,   stage: 4, d: 'Закручивает людей к центру.' },
    { name: 'Турбина',    ws: 11,  k: 1.70, cost: 0,   stage: 6, d: 'Ревёт и всасывает целый квартал.' },
  ];
  SHAPES.forEach((x, i) => { x.cost = i === 0 ? 0 : i === 1 ? 600 : Number((50 * Iref(x.stage + 0.3)).toPrecision(2)); });
  // в больших отсеках люди толпятся у входа и не заполняют дальний угол
  const FILL = [0, 0, 0.55, 0.68, 0.78, 0.86, 0.92, 0.96, 1.0];
  const BLADE_STAGE_ = [0, 0, 0, 0, 1, 2, 3, 4, 5];
  const BLADE_COSTS = BLADE_STAGE_.map((st, n) => n < 3 ? 0 : n === 3 ? 100 : Number((25 * Iref(st + 0.4)).toPrecision(2)));
  const BLADE_STAGE = [0, 0, 0, 0, 1, 2, 3, 4, 5];

  // ---------- групповой вход: транспорт ----------
  const TRANS = [
    { id: 'bus',   name: 'Автобусы', unit: 'автобус',     stage: 1,  bonus: 0.25, every: 14 },
    { id: 'metro', name: 'Метро',    unit: 'поезд метро', stage: 3,  bonus: 0.6,  every: 20 },
    { id: 'train', name: 'Поезда',   unit: 'поезд',       stage: 5,  bonus: 1.2,  every: 28 },
    { id: 'plane', name: 'Самолёты', unit: 'самолёт',     stage: 7,  bonus: 2.5,  every: 36 },
  ];
  const TRANS_MAX = 12;

  // ---------- улучшения с геометрической ценой ----------
  const SIZE_G = 1.25, ADS_G = 1.18, FEE_G = 1.16;
  // x(l) — «в каком здании» обычно покупают уровень l → l+1; k — секунд дохода этого здания; min — нижняя цена
  const lerpPts = (pts, l) => { for (let i = 1; i < pts.length; i++) if (l <= pts[i][0]) { const [a, xa] = pts[i - 1], [b, xb] = pts[i]; return xa + (xb - xa) * (l - a) / (b - a); } const n = pts.length; return pts[n - 1][1] + (l - pts[n - 1][0]) * 0.7; };
  const UP = {
    size:  { name: 'Расширение двери', k: 15, min: 20, x: l => (l - 5) / 5,       max: s => 6 + 5 * s.run.stage },
    ads:   { name: 'Реклама',          k: 9, min: 15, x: l => (l - 7) / 4,       max: s => 8 + 4 * s.run.stage },
    fee:   { name: 'Плата за вход',    k: 15, min: 40, x: l => (l - 5) / 4,       max: s => 6 + 4 * s.run.stage },
    motor: { name: 'Автопривод',       k: 12, min: 25, x: l => lerpPts([[0, -1], [4, -0.4], [7, 0.5], [10, 2], [13, 4], [16, 6], [19, 8]], l), max: () => 20 },
    gears: { name: 'Шестерни',         k: 15, min: 60, x: l => -0.6 + l * 0.9,    max: () => 10 },
    crew:  { name: 'Сервисная бригада', k: 20, min: 150, x: l => -0.2 + l * 1.6, max: () => 5 },
    fly:   { name: 'Маховик',          k: 15, min: 80, x: l => -0.6 + l * 0.6,    max: () => 15 },
  };
  TRANS.forEach(t => { UP[t.id] = { name: t.name, k: 12, min: 100, x: l => t.stage + l * (8.5 - t.stage) / TRANS_MAX, max: s => (s.run.stage >= t.stage ? TRANS_MAX : 0), trans: t }; });

  // ---------- перки (навсегда, за энергию вращения) ----------
  const START_MONEY = [0, 3e3, 3e5, 3e7, 4e9, 6e11];
  const PERKS = [
    { id: 'capital', name: 'Стартовый капитал', max: 5, cost: l => 2 + 2 * l, what: 'Деньги на счету в начале каждого забега.',
      d: l => `${l ? fmtMoney(START_MONEY[l]) : 'нет'} → <b>${fmtMoney(START_MONEY[l + 1])}</b>` },
    { id: 'word',    name: 'Сарафанное радио',  max: 8, cost: l => 2 + 2 * l, what: 'Довольные посетители зовут знакомых.',
      d: l => `пешеходы +${25 * l}% → <b>+${25 * (l + 1)}%</b>` },
    { id: 'eng',     name: 'Инженерное бюро',   max: 8, cost: l => 3 + 2 * l, what: 'Отсеки двери вмещают больше людей.',
      d: l => `вместимость +${15 * l}% → <b>+${15 * (l + 1)}%</b>` },
    { id: 'brand',   name: 'Громкое имя',       max: 8, cost: l => 3 + 3 * l, what: 'За вход в знаменитое место платят охотнее.',
      d: l => `плата за вход +${25 * l}% → <b>+${25 * (l + 1)}%</b>` },
    { id: 'bearing', name: 'Подшипники',        max: 5, cost: l => 3 + 3 * l, what: 'Меньше трение — меньше счёт за электричество, мотор сильнее.',
      d: l => `трение −${10 * l}% → <b>−${10 * (l + 1)}%</b>, мотор +${10 * l}% → <b>+${10 * (l + 1)}%</b>` },
    { id: 'brave',   name: 'Бывалые посетители', max: 5, cost: l => 4 + 4 * l, what: 'Люди успевают запрыгнуть на большей скорости.',
      d: l => `оптимум оборотов +${6 * l}% → <b>+${6 * (l + 1)}%</b>` },
    { id: 'factory', name: 'Заводская комплектация', max: 3, cost: l => 4 + 4 * l, what: 'Новый забег сразу с автоприводом, маховиком и шестернями.',
      d: l => `автопривод ур. ${4 * l} → <b>${4 * (l + 1)}</b>, маховик ур. ${3 * l} → <b>${3 * (l + 1)}</b>, шестерни ур. ${2 * l} → <b>${2 * (l + 1)}</b>` },
    { id: 'night',   name: 'Ночная смена',      max: 3, cost: l => 3 + 3 * l, what: 'Автопривод работает, пока игра закрыта.',
      d: l => `доход вне игры ${25 + 25 * l}% → <b>${25 + 25 * (l + 1)}%</b>` },
    { id: 'slots',   name: 'Отдел контрактов',  max: 2, cost: l => 10 + 15 * l, what: 'Можно брать больше контрактов на забег.',
      d: l => `контрактов на забег ${1 + l} → <b>${2 + l}</b>` },
    { id: 'star',    name: 'Звёздный агент',    max: 3, cost: l => 4 + 4 * l, what: 'Особые гости приходят чаще, эффекты длятся дольше.',
      d: l => `интервал −${25 * l}% → <b>−${25 * (l + 1)}%</b>` },
  ];

  // ---------- контракты (на один забег) ----------
  const CONTRACTS = [
    { id: 'opening', name: 'Эффект открытия',   d: 'После каждого расширения двери поток ×2 на 20 с.' },
    { id: 'bus',     name: 'Групповой тариф',   d: 'Кто приехал транспортом, платит за вход вдвое больше.' },
    { id: 'speed',   name: 'Скоростной режим',  d: 'Оптимальные обороты +30%, но дверь изнашивается вдвое быстрее.' },
    { id: 'eco',     name: 'Энергосбережение',  d: 'Электричество −60%, но автопривод слабее на 20%.' },
    { id: 'fans',    name: 'Фан-клуб',          d: 'Особые гости приходят вдвое чаще.' },
    { id: 'combo',   name: 'Шоу полётов',       d: 'Бонус комбо до +100% вместо +50%.' },
    { id: 'nightm',  name: 'Ночной рынок',      d: 'Доход вне игры 100%, но плата за вход −10%.' },
    { id: 'rent',    name: 'Льготная аренда',   d: 'Аренда −50%, но новые здания на 25% дороже.' },
    { id: 'hand',    name: 'Ручная работа',     d: 'Маховик заряжается вдвое быстрее, но электричество вдвое дороже.' },
  ];

  const SPECIALS = [
    { id: 'idol',    tag: 'КУМИР',   w: 3, msg: 'Кумир зашёл внутрь — фанаты бегут следом. Поток ×3 на 40 с' },
    { id: 'guide',   tag: 'ГИД',     w: 3, msg: 'Экскурсия! Туристам не жалко: плата за вход ×3 на 40 с' },
    { id: 'parade',  tag: 'ПАРАД',   w: 2, msg: 'Праздничное шествие сворачивает к вам. Поток ×5 на 25 с' },
    { id: 'courier', tag: 'КУРЬЕР',  w: 2, msg: 'Курьер привёз выручку соседней точки' },
    { id: 'robot',   tag: 'РОБОТ',   w: 2, msg: 'Робот-ремонтник починил дверь и смазал ось на 90 с' },
  ];
  const SPECIAL_HINT = {
    idol: 'Кликните: поток ×3 на 40 с и толпа фанатов',
    guide: 'Кликните: плата за вход ×3 на 40 с',
    parade: 'Кликните: поток ×5 на 25 с',
    courier: 'Кликните: выручка за 1,5 минуты',
    robot: 'Кликните: дверь как новая, трение −50% на 90 с',
  };

  // ---------- форматирование ----------
  const SUF = ['', ' тыс.', ' млн', ' млрд', ' трлн', ' квдрлн', ' квинтлн', ' секстлн', ' септлн', ' октлн', ' нонлн', ' децилн'];
  function fmt(n, dec) {
    if (!isFinite(n)) return '∞';
    const neg = n < 0; n = Math.abs(n);
    let s;
    if (n < 1000) {
      s = n < 10 && dec !== 0 && n % 1 ? n.toFixed(dec == null ? 1 : dec).replace('.', ',') : Math.floor(n).toString();
    } else {
      let i = Math.floor(Math.log10(n) / 3);
      if (i >= SUF.length) return (neg ? '−' : '') + n.toExponential(2).replace('.', ',').replace('e+', 'e');
      let v = n / Math.pow(1000, i);
      if (v >= 999.95) { v /= 1000; i++; }
      s = (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace('.', ',') + SUF[i];
    }
    return (neg ? '−' : '') + s;
  }
  function fmtMoney(n) { return (n < 0 ? '−₽ ' : '₽ ') + fmt(Math.abs(n), 0); }
  function plural(n, a, b, c) {
    n = Math.abs(Math.floor(n)) % 100; const d = n % 10;
    if (n > 10 && n < 20) return c; if (d > 1 && d < 5) return b; if (d === 1) return a; return c;
  }

  // ---------- состояние ----------
  function pk(meta, id) { return (meta.perks && meta.perks[id]) || 0; }
  function contractSlots(meta) { return 1 + pk(meta, 'slots'); }
  function newRun(meta) {
    const fac = pk(meta, 'factory');
    return {
      money: START_MONEY[pk(meta, 'capital')],
      stage: 0,
      lv: { size: 0, ads: 0, fee: 0, motor: fac * 4, gears: fac * 2, fly: fac * 3, crew: 0, bus: 0, metro: 0, train: 0, plane: 0 },
      blades: 2, shape: 0,
      theta: 0, omega: 0, driver: 'none',
      Q: 0, loads: [0, 0],
      autoOpt: true, motorPct: 1,
      E: 0, cond: 1, broken: false, repairT: 0, repairTotal: 0, repairKind: '',
      combo: 0, comboT: 0,
      buffs: [], tTimers: {}, specialT: 30,
      contracts: (meta.nextContracts || []).slice(0, contractSlots(meta)),
      admittedRun: 0, moneyRun: 0, runTime: 0,
      win: [], acc: { rev: 0, rent: 0, elec: 0, rep: 0, adm: 0, fl: 0, t: 0 },
      rate: { rev: 0, rent: 0, elec: 0, rep: 0, adm: 0, fl: 0, profit: 0 },
      hist: [],
    };
  }
  function newState() {
    const meta = { perks: {}, se: 0, seTotal: 0, prestiges: 0, nextContracts: [] };
    const st = {
      v: 3, meta, run: null,
      life: { admitted: 0, money: 0, time: 0, maxOmega: 0, flung: 0, specials: 0, maxCombo: 0, spent: 0, breakdowns: 0, repairs: 0 },
      won: false, wonAt: 0,
      settings: { theme: 'auto', soundMode: 'all', volume: 0.7, buy: 1, author: false, speed: 1, autoRepair: true, crowd: 1200, white: 100, sheet: 'half' },
      log: [], seNotified: false,
      lastSave: Date.now(),
    };
    st.run = newRun(meta);
    return st;
  }

  // ---------- оплата (в режиме автора всё бесплатно) ----------
  function isFree(st) { return !!(st.settings && st.settings.author); }
  function afford(st, c) { return isFree(st) || st.run.money >= c; }
  function pay(st, c) {
    if (isFree(st)) return true;
    if (!(st.run.money >= c)) return false;
    st.run.money -= c; st.life.spent += c; return true;
  }

  // ---------- производные ----------
  function perk(st, id) { return pk(st.meta, id); }
  function hasC(st, id) { return st.run.contracts.indexOf(id) >= 0; }
  function buffMult(st, kind) { let m = 1; for (const b of st.run.buffs) if (b.kind === kind) m *= b.mult; return m; }
  function hasBuff(st, key) { return st.run.buffs.some(b => b.key === key); }
  function eff(omega, ws) { const x = omega / ws; return 1 / (1 + x * x); }
  function throughput(d, omega) { const w = Math.abs(omega); return w / TAU * d.B * d.cap * eff(w, d.ws); }
  function derived(st) {
    const r = st.run, lv = r.lv, S = STAGES[r.stage];
    const shape = SHAPES[r.shape], B = r.blades;
    const condK = 0.7 + 0.3 * r.cond;

    const robot = hasBuff(st, 'robot');

  // ---------- цены ----------
  function upCost(st, id, lvl) { const u = UP[id]; if (lvl == null) lvl = st.run.lv[id]; return Math.max(u.min * Math.pow(1.6, lvl), u.k * Iref(u.x(lvl))); }

    while (cnt < want && lvl < max) {
      const c = upCost(st, id, lvl);
      if (n === 'max' && !isFree(st) && total + c > r.money) break;
      total += c; cnt++; lvl++;

    if (n === 'max' && cnt === 0 && r.lv[id] < max) { total = upCost(st, id); cnt = 1; }

  function addBuff(st, key, kind, mult, dur) {

  }
  function buyUp(st, id, n, ev) {
    const q = upQuote(st, id, n);

    st.run.lv[id] += q.cnt;
    if (id === 'size' && hasC(st, 'opening')) addBuff(st, 'opening', 'arr', 2, 20);

  function bladeCost(st) { const n = st.run.blades + 1; return n <= 8 ? BLADE_COSTS[n] : Infinity; }
  function bladeLocked(st) { const n = st.run.blades + 1; return n > 8 ? 'max' : st.run.stage < BLADE_STAGE[n] ? BLADE_STAGE[n] : 0; }

  function shapeLocked(st) { const n = st.run.shape + 1; return n >= SHAPES.length ? 'max' : st.run.stage < SHAPES[n].stage ? SHAPES[n].stage : 0; }

  function stageCost(st) { const n = st.run.stage + 1; return n < STAGES.length ? STAGES[n].cost * (hasC(st, 'rent') ? 1.25 : 1) : Infinity; }

  // ---------- износ и ремонт ----------

  }

  // ---------- особые гости ----------
  function specialInterval(st) { return (55 + Math.random() * 50) * Math.pow(0.75, perk(st, 'star')) * (hasC(st, 'fans') ? 0.5 : 1); }

  // ---------- шаг симуляции ----------

  function step(st, dt, input, ev) {

  }

  // ---------- доход вне игры ----------
  function offlineShare(st) { return hasC(st, 'nightm') ? 1 : Math.min(1, 0.25 + 0.25 * perk(st, 'night')); }

    const k = offlineShare(st);
    const s = steady(st, d, d.motorTarget, true);
    const x = d.motorTarget / d.ws, wear = 0.0007 * x * x * d.wearK;   // износ в секунду

    return { seconds, people, money, share: k, broke, workMin: work / 60 };
  }

  // ---------- сохранение ----------
  function serialize(st) {
    st.lastSave = Date.now();

    return JSON.stringify(clean);
  }
  function deserialize(str) {

    const st = Object.assign(base, o);
    st.meta = Object.assign({ perks: {}, se: 0, seTotal: 0, prestiges: 0, nextContracts: [] }, o.meta);
    st.life = Object.assign(newState().life, o.life);
    st.settings = Object.assign(newState().settings, o.settings);
    if (!Array.isArray(st.log)) st.log = [];

    st.run = Object.assign(fresh, o.run);

    else if (kind === 'fixed') Snd.tone([523, 784, 1046], 0.16, 'triangle', 0.05, 0.08);
    else if (kind === 'break') { Snd.tone([220, 165, 110, 82], 0.25, 'sawtooth', 0.06, 0.07); Snd.tone([880, 660, 880, 660], 0.12, 'square', 0.03, 0.15); }
    else if (kind === 'clank') { if (st.settings.soundMode === 'all') Snd.tone([1200 + Math.random() * 600], 0.04, 'square', 0.025); }
    else if (kind === 'win') Snd.tone([523, 659, 784, 1046, 1318, 1568], 0.6, 'triangle', 0.07, 0.12);
  }

  // ---------------- события логики ----------------
  function handleEvents(evs, d) {
    for (const e of evs) {
      switch (e.type) {
        case 'board': boardVisual(e.j, e.amount, d); break;
        case 'eject': ejectVisual(e.j, e.amount, e.omega, d); Snd.tick(); break;
        case 'fling': flingVisual(e.j, e.amount, e.omega, d); break;
        case 'breakdown':
          sfx('break'); buzz([120, 60, 220]);
          toast('Дверь сломалась! Она почти не крутится — нужен аварийный ремонт.');
          logEvent('Поломка двери');
          for (let i = 0; i < 18; i++) V.smoke.push({ x: (Math.random() - 0.5) * 0.4, y: (Math.random() - 0.5) * 0.3, z: d.Hd, vx: (Math.random() - 0.5) * 0.4, vz: 0.4 + Math.random() * 0.6, r: 3 + Math.random() * 5, t: 0, life: 1.5 + Math.random() * 1.5 });
          break;
        case 'repairStart':
          sfx('repair');
          toast(e.kind === 'emergency' ? `Аварийный ремонт: дверь встанет на ${Math.ceil(e.time)} с` : `Плановый ремонт: дверь встанет на ${Math.ceil(e.time)} с`);
          logEvent(e.kind === 'emergency' ? 'Начат аварийный ремонт' : 'Начат плановый ремонт');
          break;
        case 'repaired': V.repairFlash = 1.5; sfx('fixed'); toast('Дверь снова как новая'); logEvent(e.kind === 'emergency' ? 'Дверь починена после поломки' : 'Плановый ремонт закончен'); break;
        case 'transport': spawnVehicle(e.id, e.amount, d); break;
        case 'special': spawnSpecial(e.spec, d); break;
        case 'blades': resetRiders(); logEvent(`Поставлена ${st.run.blades}-я лопасть`); break;
        case 'shape': logEvent(`Новые лопасти: ${L.SHAPES[st.run.shape].name.toLowerCase()}`); break;
        case 'buy':
          if (e.id === 'motor' && e.from === 0) logEvent('Установлен автопривод');
          else if (e.id === 'gears' && e.from === 0) logEvent('Поставлены шестерни');
          else if (L.UP[e.id] && L.UP[e.id].trans && e.from === 0) logEvent(`Открыт транспорт: ${L.UP[e.id].name.toLowerCase()}`);
          break;
        case 'stage':
          logEvent(`Переезд: ${L.STAGES[e.stage].name}`);
          toast(`Новое здание: ${L.STAGES[e.stage].name}`); sfx('stage');
          if (curTab) showTab(curTab);
          break;
        case 'win': setTimeout(showWin, 600); sfx('win'); break;
        default: break;
      }
    }
  }

  // ---------------- симуляция кадра ----------------
  function simulate(dt) {
    const h = V.hand;
    if (h.active && performance.now() - h.lastMove > 90) h.omega *= Math.exp(-dt * 10);
    const input = { hand: h.active, handOmega: h.omega, push: V.push };
    const evs = [];
    const n = Math.min(800, Math.max(1, Math.ceil(dt / (1 / 60))));
    for (let i = 0; i < n; i++) L.step(st, dt / n, input, evs);
    const d = dims();
    if (V.riders.length !== st.run.blades) resetRiders();
    handleEvents(evs, d);
    return d;
  }

  function updateVisuals(dt, d) {
    const D = L.derived(st);
    updateWeight(dt, d, D);
    // толпа
    const target = Math.min(MAXC, Math.round(st.run.Q / V.w));
    const have = V.crowd.length + V.walkers.length;
    const ckk = Math.max(0.5, (st.settings.crowd || 1200) / 1200);
    V.spawnAcc = Math.min(V.spawnAcc + dt * 220 * ckk, 60 * ckk);
    if (have < target && V.walkers.length < MAXW) {
      let k = Math.min(target - have, Math.floor(V.spawnAcc), MAXW - V.walkers.length);
      V.spawnAcc -= k; while (k-- > 0) spawnWalker(d);
    } else if (have > target + 2) {
      let ex = Math.min(have - target, 12);
      while (ex-- > 0) {
        const p = V.walkers.length ? V.walkers.pop() : V.crowd.pop(); if (!p) break;
        p.dir = p.x < 0 ? -1 : 1; V.leavers.push(p);
      }
    }
    // идущие к очереди
    let tail = V.crowd.length;
    for (let i = V.walkers.length - 1; i >= 0; i--) {
      const p = V.walkers[i];
      const [tx, ty] = slotPos(tail + i, d);
      const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
      if (dist < 0.1) { V.walkers.splice(i, 1); V.crowd.push(p); continue; }
      const sp = p.spd * dt * (dist > 3 ? 1.5 : 1);
      p.x += dx / dist * Math.min(sp, dist); p.y += dy / dist * Math.min(sp, dist); p.ph += dt * 11 * p.spd;
    }
    // очередь
    for (let i = 0; i < V.crowd.length; i++) {
      const p = V.crowd[i]; const [tx, ty] = slotPos(i, d);
      const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
      if (dist > 0.01) { const sp = Math.min(dist, 1.6 * dt); p.x += dx / dist * sp; p.y += dy / dist * sp; p.ph += dt * 9; }
    }
    // уходящие
    for (let i = V.leavers.length - 1; i >= 0; i--) {
      const p = V.leavers[i]; p.x += p.dir * 1.1 * dt; p.y += 0.25 * dt; p.ph += dt * 10;
      if (p.x < edgeL() - 1 || p.x > edgeR() + 1) V.leavers.splice(i, 1);
    }
    if (V.leavers.length > 200) V.leavers.splice(0, V.leavers.length - 200);
    // прохожие — просто идут мимо
    const nP = Math.min(30, 5 + 3 * d.stage), ry0 = roadY(d);
    while (V.passers.length < nP) {
      const far = Math.random() < 0.45, dir = Math.random() < 0.5 ? -1 : 1;
      V.passers.push({ x: edgeL() + Math.random() * (edgeR() - edgeL()), y: far ? ry0 + (rails() ? 2.1 : 1.45) + Math.random() * 0.08 : ry0 - 0.42 + Math.random() * 0.2, dir, spd: 0.6 + Math.random() * 0.5, ph: Math.random() * TAU });
    }
    if (V.passers.length > nP) V.passers.length = nP;
    for (const p of V.passers) {
      p.x += p.dir * p.spd * dt; p.ph += dt * 9 * p.spd;
      if (p.x < edgeL() - 0.5) p.x = edgeR() + 0.3; else if (p.x > edgeR() + 0.5) p.x = edgeL() - 0.3;
    }
    // отброшенные: полёт → лежат → встают и снова в очередь
    for (let i = V.flyers.length - 1; i >= 0; i--) {
      const p = V.flyers[i]; p.t += dt;
      if (p.st === 'fly') {
        p.vz -= 6 * dt; p.z += p.vz * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.spin += dt * 12;
        if (p.y < d.Rv + 0.15) p.y = d.Rv + 0.15;
        if (p.z <= 0) { p.z = 0; p.st = 'down'; p.t = 0; p.wait = 0.5 + Math.random() * 0.7; }
      } else if (p.st === 'down') {
        if (p.t > p.wait) { V.flyers.splice(i, 1); if (V.walkers.length < MAXW) V.walkers.push({ x: p.x, y: p.y, z: 0, ph: 0, spd: 1.1 + Math.random() * 0.5 }); }
      }
    }
    V.comboT = Math.max(0, V.comboT - dt);
    V.repairFlash = Math.max(0, V.repairFlash - dt);
    if (st.run.broken && Math.random() < dt * 4 && V.smoke.length < 80) V.smoke.push({ x: (Math.random() - 0.5) * 0.3, y: (Math.random() - 0.5) * 0.2, z: d.Hd, vx: (Math.random() - 0.5) * 0.2, vz: 0.3 + Math.random() * 0.4, r: 3 + Math.random() * 4, t: 0, life: 2 + Math.random() });
    for (let i = V.smoke.length - 1; i >= 0; i--) { const m = V.smoke[i]; m.t += dt; m.x += m.vx * dt; m.z += m.vz * dt; m.r += dt * 4; if (m.t > m.life) V.smoke.splice(i, 1); }
    if (st.run.repairT > 0) { V.clankT -= dt; if (V.clankT <= 0) { V.clankT = 0.35 + Math.random() * 0.3; sfx('clank'); } }
    // пассажиры дверей
    for (const comp of V.riders) for (const p of comp) if (p.t < 1) p.t = Math.min(1, p.t + dt * 4);
    // внутри магазина: долёт → покупки у стеллажа → выход через боковую дверь с пакетом
    const walkSp = 1.25 + 0.12 * d.Wb, exitY = -d.Db * 0.5;
    for (let i = V.inside.length - 1; i >= 0; i--) {
      const p = V.inside[i];
      p.t += dt;
      if (p.t > 14) { V.inside.splice(i, 1); continue; }
      if (p.st === 'fly') {
        p.vz -= 4.5 * dt; p.z += p.vz * dt;
        if (p.z < 0) { p.z = 0; p.vz = -p.vz * 0.35; if (p.vz < 0.25) p.vz = 0; }
        const fr = p.z > 0 ? 0.25 : 2.4;
        p.vx -= p.vx * fr * dt; p.vy -= p.vy * fr * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        const xm = d.Wb - 0.08;
        if (p.x < -xm) { p.x = -xm; p.vx = Math.abs(p.vx) * 0.5; }
        if (p.x > xm) { p.x = xm; p.vx = -Math.abs(p.vx) * 0.5; }
        if (p.y < -d.Db + 0.08) { p.y = -d.Db + 0.08; p.vy = Math.abs(p.vy) * 0.5; }
        if (p.y > -0.05 && Math.hypot(p.x, p.y) > d.Rv * 0.95) { p.y = -0.05; p.vy = -Math.abs(p.vy) * 0.5; }
        if (p.z === 0 && p.vz === 0 && p.t > 0.3 && Math.hypot(p.vx, p.vy) < 0.4) {
          p.st = 'shop';
          p.tx = -d.Wb + 0.35 + Math.random() * (2 * d.Wb - 0.7);
          p.ty = -d.Db + 0.3 + Math.random() * Math.max(0.2, d.Db - d.Rv - 0.5);
          p.wait = 0.25 + Math.random() * 0.8;
        }
      } else {
        const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
        if (dist > 0.04) { const m = Math.min(dist, walkSp * dt); p.x += dx / dist * m; p.y += dy / dist * m; p.ph += dt * 11; }
        else if (p.st === 'shop') {
          p.wait -= dt;
          if (p.wait <= 0) { p.st = 'exit'; p.bag = true; p.side = p.x < 0 ? -1 : 1; p.tx = p.side * (d.Wb - 0.15); p.ty = exitY; }
        } else if (p.st === 'exit') { p.st = 'out'; p.tx = p.side * (d.Wb + 1.1); p.ty = exitY + (Math.random() - 0.5) * 0.3; }
        else if (p.st === 'out') { V.inside.splice(i, 1); continue; }
      }
    }
    // всплывающие числа
    V.ejT += dt;
    if (V.ejT > 0.8 && V.ejAgg > 0) {
      V.floats.push({ x: (Math.random() - 0.5) * d.Rv * 0.8, y: -d.Rv * 0.6, z: d.Hd + 0.15, text: '+' + fmt(Math.max(1, Math.round(V.ejAgg)), 0), t: 0, life: 1.4 });
      V.ejAgg = 0; V.ejT = 0;
    }
    for (let i = V.floats.length - 1; i >= 0; i--) { const f = V.floats[i]; f.t += dt; f.z += dt * 0.35; if (f.t > f.life) V.floats.splice(i, 1); }
    // источники
    for (let i = V.sources.length - 1; i >= 0; i--) { const s = V.sources[i]; s.t -= dt; if (s.t <= 0 || s.n <= 0) V.sources.splice(i, 1); }
    V.metroPulse = Math.max(0, V.metroPulse - dt);
    // транспорт
    for (let i = V.vehicles.length - 1; i >= 0; i--) {
      const v = V.vehicles[i]; v.t += dt;
      if (v.def.kind === 'road' || v.def.kind === 'rail') {
        if (v.phase === 'in') {
          const dist = v.stopX - v.x; const sp = Math.max(0.8, Math.min(v.speed, dist * 2.2));
          v.x += sp * dt; if (dist < 0.03) { v.phase = 'dwell'; v.t = 0; V.sources.push({ x: v.x + v.total / 2, y: v.y - 0.35, spread: v.total * 0.8, n: v.dots, t: 3 }); }
        } else if (v.phase === 'dwell') { if (v.t > 2.6) { v.phase = 'out'; v.t = 0; } }
        else { v.x += Math.min(v.speed, 1 + v.t * 4) * dt; if (v.x > edgeR() + 1) V.vehicles.splice(i, 1); }
      } else if (v.def.kind === 'sky') { if (v.t > 7) V.vehicles.splice(i, 1); }
      else if (v.def.kind === 'rocket') {
        if (v.phase === 'down') { v.z = Math.max(0, 9 - v.t * 4.5); if (v.z === 0) { v.phase = 'dwell'; v.t = 0; V.sources.push({ x: v.x - 0.3, y: v.y + 0.2, spread: 0.4, n: v.dots, t: 3 }); } }
        else if (v.phase === 'dwell') { if (v.t > 2.6) { v.phase = 'up'; v.t = 0; } }
        else { v.z = v.t * v.t * 3; if (v.z > 14) V.vehicles.splice(i, 1); }
      }
    }
    // особые гости
    for (let i = V.specials.length - 1; i >= 0; i--) {
      const s = V.specials[i]; s.t += dt; s.ph += dt * 8;
      if (s.state === 'walk') { s.x += s.dir * 0.34 * dt; if (s.x < edgeL() - 1 || s.x > edgeR() + 1) V.specials.splice(i, 1); }
      else {
        const tx = 0, ty = d.Rv + 0.1; const dx = tx - s.x, dy = ty - s.y, dist = Math.hypot(dx, dy);
        if (dist < 0.15) { V.specials.splice(i, 1); continue; }
        s.x += dx / dist * 2.8 * dt; s.y += dy / dist * 2.8 * dt; s.ph += dt * 10;
      }
    }
    return D;
  }

  // ---------------- рисование ----------------
  function line(x1, y1, x2, y2) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
  function ell(cx, cy, rx, ry, a0, a1) { ctx.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), 0, a0 == null ? 0 : a0, a1 == null ? TAU : a1); }
  function personPath(sx, sy, k) {
    const w = 2.6 * k, b = 5.4 * k, hh = 2.6 * k;
    ctx.rect(sx - w / 2, sy - b, w, b - 0.6);
    ctx.rect(sx - w / 2, sy - b - hh - 0.8, w, hh);
  }
  function drawPeople(list, k, opt) {
    if (!list.length) return;
    ctx.beginPath();
    let flags = null;
    for (const p of list) {
      const sx = px(p.x), sy = py(p.y, p.z || 0) + ((Math.sin(p.ph || 0) > 0) ? 1 : 0);
      if (sx < -20 || sx > W + 20 || sy < -40 || sy > H + 20) continue;
      personPath(sx, sy, k);
      if (p.bag) ctx.rect(sx + 1.6 * k, sy - 3.6 * k, 2.6 * k, 2.6 * k);
      if (p.flag) (flags || (flags = [])).push([sx, sy]);
    }
    ctx.fill();
    if (flags) {
      ctx.beginPath();
      for (const [sx, sy] of flags) { line(sx + 1.6 * k, sy - 4 * k, sx + 1.6 * k, sy - 15 * k); ctx.rect(sx + 1.6 * k, sy - 15 * k, 6 * k, 3.6 * k); }
      ctx.stroke(); ctx.fill();
    }
  }
  function box(x0, x1, yc, dep, z0, h, fill) {
    const X = px(x0), w = (x1 - x0) * cam.s;
    const yTop = py(yc - dep / 2, z0 + h), topH = dep * cam.s * K;
    const yFront = py(yc + dep / 2, z0 + h), fH = h * cam.s;
    ctx.fillStyle = fill || C.paper;
    ctx.fillRect(X, yTop, w, topH + fH);
    ctx.strokeRect(X, yTop, w, topH); ctx.strokeRect(X, yFront, w, fH);
    return { X, w, yFront, fH, yTop };
  }

  function drawGround(d) {
    const s = cam.s;
    // пол магазина
    const fx = px(-d.Wb), fw = d.Wb * 2 * s, fy = py(-d.Db), fh = d.Db * s * K;
    ctx.fillStyle = PAT.dots; ctx.fillRect(fx, fy, fw, fh);
    ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.ceil(-d.Wb); x <= d.Wb; x++) line(px(x), fy, px(x), fy + fh);
    for (let y = -Math.floor(d.Db); y < 0; y++) line(fx, py(y), fx + fw, py(y));
    ctx.stroke();
    // дорога
    const ry = roadY(d);
    const r0 = py(ry - 0.15), r1 = py(ry + 1.25);
    ctx.fillStyle = PAT.road; ctx.fillRect(0, r0, W, r1 - r0);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); line(0, r0, W, r0); line(0, r1, W, r1); ctx.stroke();
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 1; ctx.setLineDash([10, 10]); ctx.beginPath(); line(0, (r0 + r1) / 2, W, (r0 + r1) / 2); ctx.stroke(); ctx.setLineDash([]);
    // зебра
    ctx.fillStyle = C.ink; ctx.globalAlpha = 0.18;
    for (let i = 0; i < 7; i++) { const x = px(-0.9 + i * 0.28); ctx.fillRect(x, r0 + 3, 0.14 * s, r1 - r0 - 6); }
    ctx.globalAlpha = 1;
    // рельсы
    if (rails()) {
      const ra = py(ry + 1.45), rb = py(ry + 1.7);
      ctx.strokeStyle = C.ink2; ctx.beginPath();
      for (let x = 0; x < W; x += 9) line(x, ra - 2, x, rb + 2);
      ctx.stroke();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); line(0, ra, W, ra); line(0, rb, W, rb); ctx.stroke();
    }
    // тротуар у фасада
    ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath(); line(0, py(0.02), W, py(0.02)); ctx.stroke();
    // пол двери
    ctx.beginPath(); ell(px(0), py(0), d.Rv * s, d.Rv * s * K); ctx.fillStyle = C.paper; ctx.fill(); ctx.fillStyle = PAT.dense; ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
  }

  function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function drawSkyline(d) {
    if (d.stage < 2) return;
    const s = cam.s, baseY = py(-d.Db - 0.6);
    const n = 6 + d.stage * 3;
    ctx.lineWidth = 1; ctx.strokeStyle = C.rule;
    for (let i = 0; i < n; i++) {
      const x = -d.Wb - 4 + (i / (n - 1)) * (d.Wb * 2 + 8);
      const bw = 0.5 + rand(i) * 0.9, bh = (0.6 + rand(i + 50) * 1.4) * (0.6 + d.stage * 0.25);
      const X = px(x - bw / 2), Y = baseY - bh * s;
      ctx.fillStyle = C.paper; ctx.fillRect(X, Y, bw * s, bh * s);
      ctx.fillStyle = PAT.dots; ctx.fillRect(X, Y, bw * s, bh * s);
      ctx.strokeRect(X, Y, bw * s, bh * s);
    }
  }
  function drawStore(d) {
    const s = cam.s, st_ = d.stage;
    ctx.lineWidth = 1.5; ctx.strokeStyle = C.ink;
    // задняя стена-фасад
    const X = px(-d.Wb), w = d.Wb * 2 * s, yb = py(-d.Db), top = py(-d.Db, d.Hb);
    // башня для высоких этапов
    if (st_ >= 5) {
      const tw = d.Wb * (st_ >= 7 ? 0.9 : 0.6), th = 1.6 + (st_ - 4) * 1.4;
      const tX = px(-tw / 2), tTop = top - th * s;
      ctx.fillStyle = C.paper; ctx.fillRect(tX, tTop, tw * s, th * s);
      ctx.strokeRect(tX, tTop, tw * s, th * s);
      ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath();
      for (let yy = tTop + 10; yy < top - 4; yy += 9) line(tX + 6, yy, tX + tw * s - 6, yy);
      ctx.stroke(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
      if (st_ >= 8) { ctx.beginPath(); line(px(0), tTop, px(0), tTop - 0.9 * s); ctx.stroke(); ctx.beginPath(); ell(px(0), tTop - 0.9 * s, 4, 4); ctx.fillStyle = C.ink; ctx.fill(); }
    }
    ctx.fillStyle = C.paper; ctx.fillRect(X, top, w, yb - top);
    ctx.strokeRect(X, top, w, yb - top);
    // окна
    ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
    const rowsN = Math.max(0, Math.floor((yb - top) / (0.42 * s)) - 1);
    const colsN = Math.max(2, Math.floor(w / (0.5 * s)));
    for (let r = 0; r < rowsN; r++) for (let c = 0; c < colsN; c++) {
      const wx = X + (c + 0.25) * (w / colsN), wy = top + (r + 1.25) * 0.42 * s;
      if (wy + 0.2 * s > yb - 0.12 * s) continue;
      ctx.strokeRect(wx, wy, (w / colsN) * 0.5, 0.18 * s);
    }
    // вывеска

    const html = `<div class="eyebrow">Франшиза № ${st.meta.prestiges + 1}</div>
      <h1>Открыть франшизу?</h1>
      <p>Вы продаёте «${L.STAGES[r.stage].name}» и открываете новую точку сети — снова с ларька у дома. <b>Отменить это нельзя.</b></p>
      <div class="cols">
        <div class="list"><h3>Вы получите</h3><ul>
          <li data-m="+"><b>${g} ЭВ</b> — на счету станет ${st.meta.se + g} ЭВ. Сейчас на них можно взять ${affordable} ${pl(affordable, 'перк', 'перка', 'перков')}.</li>
          <li data-m="+">Контракты на новый забег: ${next.length ? next.join(', ') : '<b>не выбраны</b> — их можно отметить во вкладке «Франшиза»'}.</li>
        </ul></div>
        <div class="list"><h3>Обнулится</h3><ul>
          <li data-m="−">Деньги: <b>${fmtMoney(r.money)}</b> → ${fmtMoney(startMoney)}</li>
          <li data-m="−">Здание: ${L.STAGES[r.stage].name} → Ларёк у дома</li>
          <li data-m="−">Дверь: расширение ур. ${lv.size}, ${r.blades} ${pl(r.blades, 'лопасть', 'лопасти', 'лопастей')} (${L.SHAPES[r.shape].name.toLowerCase()})</li>
          <li data-m="−">Привод: автопривод ур. ${lv.motor} → ${4 * fac}, шестерни ур. ${lv.gears} → ${2 * fac}, маховик ур. ${lv.fly} → ${3 * fac}</li>
          <li data-m="−">Реклама ур. ${lv.ads}, плата за вход ур. ${lv.fee}, транспорт: ${transLv} ${pl(transLv, 'уровень', 'уровня', 'уровней')}</li>
          <li data-m="−">Очередь (${fmt(r.Q, 0)} чел.), бонусы гостей и текущие контракты</li>
        </ul></div>
        <div class="list"><h3>Останется</h3><ul>
          <li data-m="✓">Человечество: ${fmt(st.life.admitted, 0)} из 8,2 млрд</li>
          <li data-m="✓">Вся ЭВ и взятые перки</li>
          <li data-m="✓">Статистика, журнал и настройки</li>
        </ul></div>
      </div>
      <div class="warn">${low
        ? `Энергии пока немного. Обычно франшизу открывают, когда рост заметно замедлился. Следующая единица ЭВ — после ещё ${fmt(Math.max(0, need), 0)} впущенных.`
        : `Хороший момент: ${g} ЭВ заметно ускорят следующий забег.`}</div>
      <label class="check"><input type="checkbox" id="fr-ok"><span>Я понимаю: деньги, здание и все улучшения обнулятся, вернуть их будет нельзя.</span></label>`;
    const m = modal(html, [['Открыть франшизу', doPrestige], ['Остаться', null, true]], true);
    gate(m.card, m.btns[0]);
  }
  function doPrestige() {
    const g = L.seGain(st); if (g < 1) return;
    const name = L.STAGES[st.run.stage].name;
    L.prestige(st); resetVisuals();
    logEvent(`Франшиза № ${st.meta.prestiges}: продан «${name}», +${g} ЭВ`);
    save();
    toast(`Франшиза открыта: +${g} ЭВ. Возьмите перки — они действуют всегда.`); sfx('stage');
    showTab('fran');
  }
  function showResetModal() {
    const html = `<div class="eyebrow">Начать с нуля</div>
      <h1>Стереть весь прогресс?</h1>
      <p>Удалятся деньги, здания, улучшения, энергия вращения, перки, счётчик человечества, статистика и журнал. Останутся только настройки.</p>
      <div class="warn">Если хотите сохранить копию, сначала нажмите «Получить код» и сохраните его.</div>
      <label class="check"><input type="checkbox" id="rs-ok"><span>Я понимаю, что прогресс удалится безвозвратно.</span></label>`;
    const m = modal(html, [['Стереть', () => {
      const keep = Object.assign({}, st.settings, { author: false, speed: 1 });
      st = L.newState(); Object.assign(st.settings, keep);
      resetVisuals(); applyTheme(); save(); showTab('door'); toast('Новая игра. Ларёк снова открыт.');
    }], ['Отмена', null, true]], false);
    gate(m.card, m.btns[0]);
  }
  function showIntro() {
    modal(`<div class="eyebrow">Ларёк у дома · одна вращающаяся дверь</div>
      <h1>Круговорот</h1>
      <p>У вас крошечный ларёк и стеклянная вертушка на входе. Люди ждут в очереди, дверь переносит их внутрь, каждый платит за вход. Из выручки — аренда, электричество и улучшения.</p>
      <p>Крутите дверь, расширяйте её, меняйте лопасти, зовите автобусы и самолёты. Цель скромная: впустить всё человечество — <b>8,2 млрд человек</b>.</p>
      <p class="note">Зажмите кнопку мыши и рисуйте круги вокруг двери — сила руки копится в маховике. Слишком быстро — людей отбросит. Пробел тоже толкает.</p>`,
      [['Открыть двери', null]]);
  }
  function showOffline(o) {
    const head = o.already ? 'Дверь так и стоит сломанной' : `+${fmt(o.people, 0)} чел.`;
    const body = o.already ? 'Пока вас не было, сломанная дверь ничего не впустила. Почините её — и автопривод снова заработает.'
      : `Автопривод крутил дверь без вас. Прибыль после аренды, электричества и ремонтов: <b>+${fmtMoney(o.money)}</b>.` + (o.broke ? ` <b>Через ${Math.round(o.workMin)} мин дверь сломалась</b> и простояла до вашего возвращения — наймите сервисную бригаду, она чинит сама.` : '');
    modal(`<div class="eyebrow">Пока вас не было · ${fmtTime(o.seconds)}</div>
      <h1>${head}</h1>
      <p>${body}</p>
      <p class="note">Без присмотра дверь работает на ${Math.round((o.share || 0.25) * 100)}% мощности. Перк «Ночная смена» поднимает эту долю.</p>`,
      [['К двери', null]]);
  }
  function showWin() {
    logEvent('Всё человечество внутри: 8,2 млрд');
    modal(`<div class="eyebrow">8 200 000 000 человек</div>
      <h1>Всё человечество внутри</h1>
      <p>Ларёк у дома превратился в насос, который втянул планету. Двери крутятся, касса звенит, снаружи никого.</p>
      <div class="kv">
        <span>Время</span><span>${fmtTime(st.life.time)}</span>
        <span>Франшиз</span><span>${st.meta.prestiges}</span>
        <span>Рекорд оборотов</span><span>${rpm(st.life.maxOmega)} об/мин</span>
        <span>Рекорд комбо</span><span>×${st.life.maxCombo}</span>
        <span>Отброшено дверью</span><span>${fmt(st.life.flung, 0)}</span>
        <span>Особых гостей</span><span>${st.life.specials}</span>
        <span>Заработано</span><span>${fmtMoney(st.life.money)}</span>
        <span>Потрачено</span><span>${fmtMoney(st.life.spent)}</span>
      </div>
      <p class="note">Можно крутить дальше.</p>`,
      [['Крутить дальше', null]]);
  }

  // ---------------- ввод ----------------
  function angleAt(sx, sy) { const d = dims(); return Math.atan2((sy - py(0, d.Hd / 2)) / (cam.s * K), (sx - cam.cx) / cam.s); }
  function localXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', e => {
    Snd.init();
    const [x, y] = localXY(e);
    const sp = hitSpecial(x, y);
    if (sp) { clickSpecial(sp); return; }
    const h = V.hand; h.active = true; h.pid = e.pointerId; h.lastA = angleAt(x, y); h.lastT = performance.now(); h.omega = 0; h.sx = x; h.sy = y; h.lastMove = performance.now();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* без захвата */ }
    cv.classList.add('grabbing');
  });
  cv.addEventListener('pointermove', e => {
    const [x, y] = localXY(e);
    const h = V.hand;
    if (h.active && e.pointerId === h.pid) {
      const now = performance.now(), a = angleAt(x, y);
      let da = a - h.lastA; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      const dtm = (now - h.lastT) / 1000;
      if (dtm > 0.004) {
        const lim = L.HAND_MAX * 1.5;
        const inst = Math.max(-lim, Math.min(lim, da / dtm));
        h.omega = h.omega * 0.45 + inst * 0.55; h.lastA = a; h.lastT = now; h.lastMove = now;
      }
      h.sx = x; h.sy = y;
    } else {
      const sp = hitSpecial(x, y); V.hover = sp;
      cv.classList.toggle('pointing', !!sp);
    }
  });
  function endHand(e) { const h = V.hand; if (h.active && (!e || e.pointerId === h.pid)) { h.active = false; h.omega = 0; cv.classList.remove('grabbing'); } }
  cv.addEventListener('pointerup', endHand); cv.addEventListener('pointercancel', endHand); cv.addEventListener('lostpointercapture', endHand);
  const SECRET = ['KeyA', 'KeyU', 'KeyT', 'KeyH', 'KeyO', 'KeyR'];
  let secretPos = 0;
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    if (e.code === SECRET[secretPos]) { secretPos++; if (secretPos === SECRET.length) { secretPos = 0; setAuthor(!st.settings.author); return; } }
    else secretPos = e.code === SECRET[0] ? 1 : 0;
    if (e.code === 'Space') { V.push = true; Snd.init(); e.preventDefault(); }
    else if (/^Digit[1-6]$/.test(e.code)) showTab(TAB_ORDER[+e.code.slice(5) - 1]);
    else if (e.code === 'KeyM') { const order = ['all', 'nodoor', 'off']; st.settings.soundMode = order[(order.indexOf(st.settings.soundMode) + 1) % 3]; Snd.init(); toast('Звук: ' + SOUND_NAMES[st.settings.soundMode]); refreshPanel(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') V.push = false; });
  window.addEventListener('blur', () => { V.push = false; endHand(); });

  // ---------------- цикл ----------------
  function resetVisuals() {
    V.crowd = []; V.walkers = []; V.leavers = []; V.passers = []; V.flyers = []; V.smoke = []; V.inside = []; V.floats = []; V.vehicles = []; V.specials = []; V.sources = [];
    V.w = 1; V.wPending = 1; resetRiders();
  }
  let last = performance.now(), saveT = 0, uiT = 0, hintT = 0, hiddenAt = 0;
  const hintEl = $('#hint');
  function frame(now) {
    let dt = Math.max(0, (now - last) / 1000); last = now;
    if (dt > 2) catchUp(dt); else {
      dt = Math.min(dt, 0.1);
      const speed = L.isFree(st) ? Math.max(1, st.settings.speed || 1) : 1;
      const d = simulate(dt * speed);
      const D = updateVisuals(dt, d);
      render(d, D);
      Snd.update(st.run.omega);
      uiT += dt; hintT += dt; saveT += dt;
      if (uiT > 0.2) {
        uiT = 0; updateHUD(); refreshPanel();
        if (!st.seNotified && L.seGain(st) >= 1) {
          st.seNotified = true;
          toast('Стала доступна франшиза. Подробности во вкладке «Франшиза» — без вашего подтверждения ничего не сбросится.');
        }
      }
      if (hintT > 1) { hintT = 0; setText(hintEl, hintText(D)); }
      if (saveT > 10) { saveT = 0; save(); }
    }
    requestAnimationFrame(frame);
  }
  function catchUp(sec) {
    const sim = Math.min(sec, 120), evs = [];
    for (let t = 0; t < sim; t += 0.05) L.step(st, 0.05, {}, evs);
    if (evs.some(e => e.type === 'win')) setTimeout(showWin, 300);
    if (sec > 120) { const o = L.offline(st, sec - 120); if (o) { toast(`Пока вкладка спала: +${fmt(o.people, 0)} чел., +${fmtMoney(o.money)}`); logEvent(`Вкладка спала: +${fmt(o.people, 0)} чел.`); } }
    resetVisuals();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (hiddenAt) { const gap = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now(); if (gap > 2) catchUp(gap); }
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('resize', () => { resize(); if (st) fitCamera(dims(), true); });

  function start(data) {
    let fresh = false;
    try {
      if (data && data.save) st = L.deserialize(data.save);
    } catch (e) { st = null; }
    if (!st) {
      const raw = lsGet(SAVE_KEY);
      if (raw) { try { st = L.deserialize(raw); } catch (e) { st = null; } }
      if (st && !(data && data.save)) {
        const gap = (Date.now() - (st.lastSave || Date.now())) / 1000;
        const o = gap > 30 ? L.offline(st, gap) : null;
        if (o) { setTimeout(() => showOffline(o), 400); setTimeout(() => logEvent(`Без вас: +${fmt(o.people, 0)} чел., +${fmtMoney(o.money)}`), 0); }
      }
    }
    if (!st) { st = L.newState(); fresh = true; }
    applyTheme(); applyCrowd();
    resetRiders();
    resize();
    fitCamera(dims(), true);
    showTab('door');
    updateHUD();
    if (fresh) showIntro();
    const checkHash = () => { if (location.hash === '#author') setAuthor(true); };
    checkHash(); window.addEventListener('hashchange', checkHash);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); });
    window.claude?.hot?.snapshot?.(() => ({ save: L.serialize(st) }));
    // отладочный доступ для тестов
    window.__krug = { get st() { return st; }, L, V, save, cam };
    last = performance.now();
    requestAnimationFrame(frame);
  }
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
  void lsDel;
})();

</script>
</body>
</html>
